name: Docker CI Pipeline

on:
  push:
    branches: [ "adarsh" ]
  pull_request:
    branches: [ "adarsh" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Set image tag
    - name: Set image tag
      id: vars
      run: echo "TAG=$(date +%s)" >> $GITHUB_OUTPUT

    # 3️⃣ Build Docker image
    - name: Build Docker image
      run: docker build -t my-image-name:${{ steps.vars.outputs.TAG }} .

    # 4️⃣ Run container (for testing)
    - name: Run container
      run: |
        docker run -d -p 8080:8080 --name test-container my-image-name:${{ steps.vars.outputs.TAG }}
        sleep 10

    # 5️⃣ Basic health check (example)
    - name: Test application
      run: |
        curl -f http://localhost:8080 || (echo "App failed" && exit 1)

    # 6️⃣ Stop container
    - name: Stop container
      run: docker stop test-container

    # 7️⃣ Login to Docker Hub
    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 8️⃣ Tag image for Docker Hub
    - name: Tag image
      if: github.event_name == 'push'
      run: docker tag my-image-name:${{ steps.vars.outputs.TAG }} ${{ secrets.DOCKER_USERNAME }}/my-image-name:${{ steps.vars.outputs.TAG }}

    # 9️⃣ Push image
    - name: Push image
      if: github.event_name == 'push'
      run: docker push ${{ secrets.DOCKER_USERNAME }}/my-image-name:${{ steps.vars.outputs.TAG }}
